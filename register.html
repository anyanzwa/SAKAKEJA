<!DOCTYPE html>
<html lang="en">
<head>
<!-- PWA Meta Tags -->
<!-- PWA Meta Tags -->
<!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/Square150x150Logo.scale-100.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/Square150x150Logo.scale-200.png">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="150x150" href="/icons/Square150x150Logo.scale-100.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Saka Keja</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        
        body { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #f9f9f9 0%, #0d47a1 100%);
            padding: 20px;
        }
        
        /* ===== TOAST NOTIFICATIONS ===== */
        #toastContainer {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            max-width: 90%;
        }

        .toast {
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            animation: toastIn 0.4s ease-out;
            pointer-events: auto;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(8px);
        }

        .toast.success { background: #0f9d58; }
        .toast.error { background: #d93025; }
        .toast.info { background: #1a73e8; }
        .toast.warning { background: #ff6d00; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.hide {
            animation: toastOut 0.3s ease-in forwards;
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        /* ===== LOADING OVERLAY ===== */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        #loadingOverlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #fff;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #loadingOverlay p {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== AUTH BOX ===== */
        .auth-box {
            background: white;
            padding: 30px 25px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { 
            from { transform: translateY(40px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        .auth-box h1 { 
            font-size: 28px; 
            color: #1a73e8; 
            margin-bottom: 4px; 
        }

        .auth-box .subtitle { 
            color: #666; 
            margin-bottom: 20px; 
            font-size: 14px; 
        }

        .auth-box input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fa;
            transition: border-color 0.2s;
        }

        .auth-box input:focus { 
            border-color: #1a73e8; 
            outline: none; 
            background: white; 
        }

        .auth-box .role-select { 
            margin: 8px 0; 
        }

        .auth-box .role-select label { 
            display: inline-block; 
            margin-right: 20px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
        }

        .auth-box .role-select input[type="radio"] { 
            width: auto; 
            margin-right: 6px; 
        }

        .auth-box button {
            width: 100%;
            padding: 16px;
            margin: 12px 0 8px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: #0f9d58;
            color: white;
            transition: background 0.2s;
        }

        .auth-box button:active { 
            transform: scale(0.98); 
        }

        .auth-box button:hover { 
            background: #0b7e46; 
        }

        .auth-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-box .toggle-link { 
            text-align: center; 
            margin-top: 12px; 
            font-size: 14px; 
            color: #555; 
        }

        .auth-box .toggle-link a { 
            color: #1a73e8; 
            font-weight: 600; 
            cursor: pointer; 
            text-decoration: none; 
        }

        .auth-box .toggle-link a:hover {
            text-decoration: underline;
        }

        .auth-box .error-msg { 
            color: #d93025; 
            font-size: 14px; 
            text-align: center; 
            margin-top: 8px; 
        }

        .auth-box .success-msg { 
            color: #0f9d58; 
            font-size: 14px; 
            text-align: center; 
            margin-top: 8px; 
        }

        .mt-8 {
            margin-top: 8px;
        }

        /* Password strength indicator */
        .password-hint {
            font-size: 12px;
            color: #888;
            margin-top: -4px;
            margin-bottom: 8px;
        }

        .password-hint .valid {
            color: #0f9d58;
        }

        .password-hint .invalid {
            color: #d93025;
        }
    </style>
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toastContainer"></div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>

    <div class="auth-box">
        <h1>🏠 Saka Keja</h1>
        <p class="subtitle">Create your free account</p>
        
        <form id="registerForm">
            <input type="text" id="registerName" placeholder="Full name" required autocomplete="name">
            <input type="email" id="registerEmail" placeholder="Email address" required autocomplete="email">
            <input type="password" id="registerPassword" placeholder="Password (min 6 characters)" required autocomplete="new-password">
            
            <!-- Password strength hint -->
            <div class="password-hint" id="passwordHint">
                <span id="lengthCheck">❌</span> At least 6 characters
            </div>
            
            <div class="role-select">
                <label>I am a:</label>
                <label><input type="radio" name="role" value="tenant" checked> 👤 Tenant</label>
                <label><input type="radio" name="role" value="landlord"> 👔 Landlord</label>
            </div>
            
            <button type="submit" id="registerBtn">📝 Create Account</button>
        </form>
        
        <div id="registerError" class="error-msg"></div>
        <div id="registerSuccess" class="success-msg"></div>
        
        <div class="toggle-link">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
        <div class="toggle-link mt-8">
            <a href="index.html">⬅️ Back to home</a>
        </div>
    </div>
    <script>
    // ==============================================================
    // REGISTER SERVICE WORKER (PWA)
    // ==============================================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
                console.log('✅ Service Worker registered successfully!');
            })
            .catch(error => {
                console.log('❌ Service Worker registration failed:', error);
            });
    }
    </script>

    <script>
        // ==============================================================
        // FIREBASE CONFIG
        // ==============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCTekqCGBPIjxTK8iMm0gxLqX5JkhJndi4",
            authDomain: "saka-keja-54ae6.firebaseapp.com",
            projectId: "saka-keja-54ae6",
            storageBucket: "saka-keja-54ae6.firebasestorage.app",
            messagingSenderId: "333792304442",
            appId: "1:333792304442:web:f316912480457b863c0403"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==============================================================
        // TOAST NOTIFICATIONS
        // ==============================================================
        function showToast(message, type = 'info', duration = 3000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 300);
            }, duration);
        }

        function toastSuccess(msg) { showToast(msg, 'success'); }
        function toastError(msg) { showToast(msg, 'error'); }
        function toastInfo(msg) { showToast(msg, 'info'); }
        function toastWarning(msg) { showToast(msg, 'warning'); }

        // ==============================================================
        // LOADING STATES
        // ==============================================================
        function showLoading(text = 'Loading...') {
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            loadingText.textContent = text;
            overlay.style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // ==============================================================
        // PASSWORD STRENGTH CHECKER
        // ==============================================================
        document.getElementById('registerPassword').addEventListener('input', function() {
            const password = this.value;
            const lengthCheck = document.getElementById('lengthCheck');
            
            if (password.length >= 6) {
                lengthCheck.textContent = '✅';
                lengthCheck.className = 'valid';
            } else {
                lengthCheck.textContent = '❌';
                lengthCheck.className = 'invalid';
            }
        });

        // ==============================================================
        // REDIRECT IF ALREADY LOGGED IN
        // ==============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ==============================================================
        // REGISTRATION
        // ==============================================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const roleRadio = document.querySelector('input[name="role"]:checked');
            const role = roleRadio ? roleRadio.value : 'tenant';
            const registerBtn = document.getElementById('registerBtn');
            
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            
            errorDiv.textContent = '';
            successDiv.textContent = '';

            // ===== VALIDATION =====
            if (!name) {
                toastWarning('Please enter your full name.');
                return;
            }

            if (!email || !email.includes('@') || !email.includes('.')) {
                toastWarning('Please enter a valid email address.');
                return;
            }

            if (password.length < 6) {
                toastWarning('Password must be at least 6 characters.');
                return;
            }

            // ===== SUBMIT =====
            registerBtn.disabled = true;
            registerBtn.textContent = '⏳ Creating account...';
            showLoading('Creating your account...');

            try {
                // STEP 1: Create user in Firebase Authentication
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCred.user;
                console.log('✅ User created in Auth:', user.uid);

                // STEP 2: Save user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    role: role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('✅ User document created in Firestore');

                hideLoading();
                successDiv.textContent = '✅ Account created successfully!';
                toastSuccess('🎉 Welcome to Saka Keja, ' + name + '!');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (err) {
                hideLoading();
                registerBtn.disabled = false;
                registerBtn.textContent = '📝 Create Account';
                
                console.error('❌ Registration error:', err);
                
                // User-friendly error messages
                let errorMessage = err.message;
                if (errorMessage.includes('email-already-in-use')) {
                    errorMessage = 'This email is already registered. Please login instead.';
                } else if (errorMessage.includes('invalid-email')) {
                    errorMessage = 'Please enter a valid email address.';
                } else if (errorMessage.includes('weak-password')) {
                    errorMessage = 'Password is too weak. Please use at least 6 characters.';
                } else if (errorMessage.includes('network-request-failed')) {
                    errorMessage = 'Network error. Please check your internet connection.';
                }
                
                errorDiv.textContent = '❌ ' + errorMessage;
                toastError(errorMessage);
            }
        });

        console.log('✅ Saka Keja Register Page loaded!');
    </script>
</body>
</html>
