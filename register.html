<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Saka Keja</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ... (keep your existing CSS) ... */
        /* I'll include the full CSS from your existing register.html for brevity, but you can keep yours. */
        /* For completeness, I'll include a minified version here. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f1e;
            color: #eef2f6;
            padding: 20px;
        }
        .bg-simple {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1e 0%, #1a1f3a 50%, #0f1428 100%);
        }
        #toastContainer {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            max-width: 90%;
        }
        .toast {
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: toastIn 0.4s ease-out;
            pointer-events: auto;
            text-align: center;
            max-width: 400px;
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .toast.info { background: #3b82f6; }
        .toast.warning { background: #f59e0b; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.hide {
            animation: toastOut 0.3s ease-in forwards;
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 30, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        #loadingOverlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loadingOverlay p {
            color: #eef2f6;
            font-size: 16px;
            font-weight: 500;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-box .logo {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            color: #eef2f6;
        }
        .auth-box .logo span { color: #f97316; }
        .auth-box .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box input {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.06);
            color: #eef2f6;
            transition: border-color 0.2s;
        }
        .auth-box input::placeholder { color: #64748b; }
        .auth-box input:focus {
            border-color: #f97316;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }
        .password-match-hint {
            font-size: 12px;
            margin-top: -4px;
            margin-bottom: 8px;
            min-height: 20px;
        }
        .password-match-hint .match-valid { color: #34d399; }
        .password-match-hint .match-invalid { color: #f87171; }
        .password-match-hint .match-empty { color: #64748b; }
        .role-select { margin: 8px 0; }
        .role-select label {
            display: inline-block;
            margin-right: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #94a3b8;
        }
        .role-select label:hover { color: #eef2f6; }
        .role-select input[type="radio"] {
            width: auto;
            margin-right: 6px;
            accent-color: #f97316;
        }
        .auth-box button {
            width: 100%;
            padding: 16px;
            margin: 12px 0 8px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #0b0f1e;
            transition: all 0.2s ease;
        }
        .auth-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.3);
        }
        .auth-box button:active { transform: scale(0.97); }
        .auth-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg { color: #f87171; font-size: 14px; text-align: center; margin-top: 8px; }
        .success-msg { color: #34d399; font-size: 14px; text-align: center; margin-top: 8px; }
        .toggle-link { text-align: center; margin-top: 16px; font-size: 14px; color: #94a3b8; }
        .toggle-link a { color: #f97316; font-weight: 600; text-decoration: none; cursor: pointer; }
        .toggle-link a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-top: 8px; font-size: 13px; }
        .back-link a { color: #64748b; text-decoration: none; cursor: pointer; }
        .back-link a:hover { color: #94a3b8; }
        @media screen and (max-width: 480px) {
            .auth-box { padding: 24px 18px; }
            .auth-box .logo { font-size: 24px; }
            .auth-box input { padding: 12px 14px; font-size: 14px; }
            .auth-box button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="bg-simple"></div>
    <div id="toastContainer"></div>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">🏠 Saka<span>Keja</span></div>
            <p class="subtitle">Create your free account</p>

            <form id="registerForm">
                <input type="text" id="registerName" placeholder="Full name" required autocomplete="name">
                <input type="email" id="registerEmail" placeholder="Email address" required autocomplete="email">
                <input type="password" id="registerPassword" placeholder="Password (min 6 characters)" required autocomplete="new-password">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">

                <div class="password-match-hint" id="passwordMatchHint">
                    <span id="matchStatus">🔑</span> <span id="matchText" class="match-empty">Passwords must match</span>
                </div>

                <div class="role-select">
                    <label>I am a:</label>
                    <label><input type="radio" name="role" value="tenant" checked> 👤 Tenant</label>
                    <label><input type="radio" name="role" value="landlord"> 👔 Landlord</label>
                </div>

                <button type="submit" id="registerBtn">📝 Create Account</button>
            </form>

            <div id="registerError" class="error-msg"></div>
            <div id="registerSuccess" class="success-msg"></div>

            <div class="toggle-link">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
            <div class="back-link">
                <a href="index.html">⬅️ Back to home</a>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // FIREBASE CONFIG
        // ==============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCTekqCGBPIjxTK8iMm0gxLqX5JkhJndi4",
            authDomain: "saka-keja-54ae6.firebaseapp.com",
            projectId: "saka-keja-54ae6",
            storageBucket: "saka-keja-54ae6.firebasestorage.app",
            messagingSenderId: "333792304442",
            appId: "1:333792304442:web:f316912480457b863c0403"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==============================================================
        // TOAST & LOADING
        // ==============================================================
        function showToast(message, type = 'info', duration = 3000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
            }, duration);
        }

        function toastSuccess(msg) { showToast(msg, 'success'); }
        function toastError(msg) { showToast(msg, 'error'); }
        function toastInfo(msg) { showToast(msg, 'info'); }
        function toastWarning(msg) { showToast(msg, 'warning'); }

        function showLoading(text = 'Loading...') {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // ==============================================================
        // PASSWORD MATCH CHECKER
        // ==============================================================
        const passwordInput = document.getElementById('registerPassword');
        const confirmInput = document.getElementById('confirmPassword');
        const matchStatus = document.getElementById('matchStatus');
        const matchText = document.getElementById('matchText');

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (password.length === 0 && confirm.length === 0) {
                matchStatus.textContent = '🔑';
                matchText.textContent = 'Passwords must match';
                matchText.className = 'match-empty';
                return false;
            }

            if (password.length >= 6 && confirm.length >= 6 && password === confirm) {
                matchStatus.textContent = '✅';
                matchText.textContent = 'Passwords match!';
                matchText.className = 'match-valid';
                return true;
            } else if (confirm.length > 0 && password !== confirm) {
                matchStatus.textContent = '❌';
                matchText.textContent = 'Passwords do not match';
                matchText.className = 'match-invalid';
                return false;
            } else {
                matchStatus.textContent = '⏳';
                matchText.textContent = 'Keep typing...';
                matchText.className = 'match-empty';
                return false;
            }
        }

        passwordInput.addEventListener('input', checkPasswordMatch);
        confirmInput.addEventListener('input', checkPasswordMatch);

        // ==============================================================
        // REDIRECT IF ALREADY LOGGED IN
        // ==============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ==============================================================
        // REGISTRATION - FIXED: Saves to Firestore correctly with error handling
        // ==============================================================
        // ==============================================================
// REGISTRATION - FIXED: Saves to Firestore correctly
// ==============================================================
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const roleRadio = document.querySelector('input[name="role"]:checked');
        const role = roleRadio ? roleRadio.value : 'tenant';
        const registerBtn = document.getElementById('registerBtn');

        const errorDiv = document.getElementById('registerError');
        const successDiv = document.getElementById('registerSuccess');

        errorDiv.textContent = '';
        successDiv.textContent = '';

        // ===== VALIDATION =====
        if (!name) {
            toastWarning('Please enter your full name.');
            return;
        }

        if (!email || !email.includes('@') || !email.includes('.')) {
            toastWarning('Please enter a valid email address.');
            return;
        }

        if (password.length < 6) {
            toastWarning('Password must be at least 6 characters.');
            return;
        }

        if (password !== confirmPassword) {
            toastWarning('Passwords do not match. Please try again.');
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = '⏳ Creating account...';
        showLoading('Creating your account...');

        try {
            // ===== STEP 1: Create Auth Account =====
            console.log('📝 Creating auth account for:', email);
            const userCred = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCred.user;
            console.log('✅ Auth user created:', user.uid);

            // ===== STEP 2: Save user data to Firestore =====
            console.log('💾 Saving user data to Firestore...');
            const userData = {
                name: name,
                email: email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(user.uid).set({
                name: name,  // ← This must be the name from the input field
                email: email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('✅ User document saved to Firestore');

            // ===== STEP 3: Success =====
            hideLoading();
            successDiv.textContent = '✅ Account created successfully!';
            toastSuccess('🎉 Welcome to Saka Keja, ' + name + '!');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);

        } catch (err) {
            hideLoading();
            registerBtn.disabled = false;
            registerBtn.textContent = '📝 Create Account';

            console.error('❌ Registration error:', err);

            let errorMessage = err.message;
            if (errorMessage.includes('email-already-in-use')) {
                errorMessage = 'This email is already registered. Please login instead.';
            } else if (errorMessage.includes('invalid-email')) {
                errorMessage = 'Please enter a valid email address.';
            } else if (errorMessage.includes('weak-password')) {
                errorMessage = 'Password is too weak. Please use at least 6 characters.';
            } else if (errorMessage.includes('network-request-failed')) {
                errorMessage = 'Network error. Please check your internet connection.';
            } else if (errorMessage.includes('permission-denied')) {
                errorMessage = 'Permission denied. Please check Firestore rules.';
            }

            errorDiv.textContent = '❌ ' + errorMessage;
            toastError(errorMessage);
        }
    });
    </script>
</body>
</html>
