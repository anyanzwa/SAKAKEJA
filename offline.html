<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/Square150x150Logo.scale-100.png">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="150x150" href="/icons/Square150x150Logo.scale-100.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Saka Keja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 20px; text-align: center; }
        .container { max-width: 400px; }
        .icon { font-size: 64px; display: block; margin-bottom: 16px; }
        h1 { font-size: 24px; color: #1a73e8; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 20px; }
        .btn { padding: 12px 32px; border-radius: 30px; background: #1a73e8; color: white; border: none; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📡</span>
        <h1>You're Offline</h1>
        <p>Don't worry! Your saved properties and favorites are still available.</p>
        <a href="/" class="btn">⬅️ Go Back</a>
    </div>
