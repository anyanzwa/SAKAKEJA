<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Saka Keja</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ============================================================
           GLOBAL RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f1e;
            color: #eef2f6;
            padding: 20px;
        }

        /* ============================================================
           BACKGROUND
           ============================================================ */
        .bg-simple {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0b0f1e 0%, #1a1f3a 50%, #0f1428 100%);
        }

        /* ============================================================
           TOAST & LOADING
           ============================================================ */
        #toastContainer {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            max-width: 90%;
        }

        .toast {
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: toastIn 0.4s ease-out;
            pointer-events: auto;
            text-align: center;
            max-width: 400px;
        }

        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .toast.info { background: #3b82f6; }
        .toast.warning { background: #f59e0b; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.hide {
            animation: toastOut 0.3s ease-in forwards;
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 30, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        #loadingOverlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #loadingOverlay p {
            color: #eef2f6;
            font-size: 16px;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           AUTH BOX
           ============================================================ */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-box .logo {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            color: #eef2f6;
        }

        .auth-box .logo span {
            color: #f97316;
        }

        .auth-box .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-box input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.06);
            color: #eef2f6;
            transition: border-color 0.2s;
        }

        .auth-box input::placeholder {
            color: #64748b;
        }

        .auth-box input:focus {
            border-color: #f97316;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-box .forgot-link {
            text-align: right;
            margin-top: 4px;
        }

        .auth-box .forgot-link a {
            font-size: 13px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .auth-box .forgot-link a:hover {
            color: #f97316;
        }

        .auth-box button {
            width: 100%;
            padding: 16px;
            margin: 12px 0 8px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: #0b0f1e;
            transition: all 0.2s ease;
        }

        .auth-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(249, 115, 22, 0.3);
        }

        .auth-box button:active {
            transform: scale(0.97);
        }

        .auth-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-box .error-msg {
            color: #f87171;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
        }

        .auth-box .success-msg {
            color: #34d399;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
        }

        .auth-box .toggle-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
        }

        .auth-box .toggle-link a {
            color: #f97316;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-box .toggle-link a:hover {
            text-decoration: underline;
        }

        .auth-box .back-link {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
        }

        .auth-box .back-link a {
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-box .back-link a:hover {
            color: #94a3b8;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media screen and (max-width: 480px) {
            .auth-box {
                padding: 24px 18px;
            }
            .auth-box .logo {
                font-size: 24px;
            }
            .auth-box input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .auth-box button {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-simple"></div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toastContainer"></div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>

    <!-- ===== AUTH CONTAINER ===== -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">
                🏠 Saka<span>Keja</span>
            </div>
            <p class="subtitle">Sign in to your account</p>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email address" required autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">

                <div class="forgot-link">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" id="loginBtn">🔑 Sign In</button>
            </form>

            <div id="loginError" class="error-msg"></div>
            <div id="loginSuccess" class="success-msg"></div>

            <div class="toggle-link">
                Don't have an account? <a href="register.html">Create one here</a>
            </div>
            <div class="back-link">
                <a href="index.html">⬅️ Back to home</a>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // FIREBASE CONFIG
        // ==============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCTekqCGBPIjxTK8iMm0gxLqX5JkhJndi4",
            authDomain: "saka-keja-54ae6.firebaseapp.com",
            projectId: "saka-keja-54ae6",
            storageBucket: "saka-keja-54ae6.firebasestorage.app",
            messagingSenderId: "333792304442",
            appId: "1:333792304442:web:f316912480457b863c0403"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==============================================================
        // TOAST & LOADING
        // ==============================================================
        function showToast(message, type = 'info', duration = 3000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
            }, duration);
        }

        function toastSuccess(msg) { showToast(msg, 'success'); }
        function toastError(msg) { showToast(msg, 'error'); }
        function toastInfo(msg) { showToast(msg, 'info'); }
        function toastWarning(msg) { showToast(msg, 'warning'); }

        function showLoading(text = 'Loading...') {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // ==============================================================
        // REDIRECT IF ALREADY LOGGED IN
        // ==============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ==============================================================
        // LOGIN
        // ==============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.textContent = '';
            successDiv.textContent = '';

            if (!email || !password) {
                toastWarning('Please fill in all fields.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Signing in...';
            showLoading('Signing you in...');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                successDiv.textContent = '✅ Sign in successful!';
                toastSuccess('🎉 Welcome back!');
                setTimeout(() => {
                    hideLoading();
                    window.location.href = 'index.html';
                }, 1500);
            } catch (err) {
                hideLoading();
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Sign In';

                let errorMessage = err.message;
                if (errorMessage.includes('user-not-found')) {
                    errorMessage = 'No account found with this email. Please register.';
                } else if (errorMessage.includes('wrong-password')) {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (errorMessage.includes('too-many-requests')) {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                } else if (errorMessage.includes('invalid-email')) {
                    errorMessage = 'Please enter a valid email address.';
                }

                errorDiv.textContent = '❌ ' + errorMessage;
                toastError(errorMessage);
            }
        });

        // ==============================================================
        // FORGOT PASSWORD
        // ==============================================================
        document.getElementById('forgotPassword').addEventListener('click', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                toastWarning('Please enter your email address first.');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                toastWarning('Please enter a valid email address.');
                return;
            }

            showLoading('Sending password reset...');

            try {
                await auth.sendPasswordResetEmail(email);
                hideLoading();
                toastSuccess('✅ Password reset email sent! Check your inbox (and spam folder).');
            } catch (err) {
                hideLoading();
                let errorMessage = err.message;
                if (errorMessage.includes('user-not-found')) {
                    errorMessage = 'No account found with this email.';
                }
                toastError('❌ ' + errorMessage);
            }
        });
    </script>
</body>
</html>
